<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#103C4A">
<title>রুকন প্রস্তুতি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="p-body">
<main class="p-wrap" id="app"></main>
<script type="module">
import { db, collection, getDocs } from "./assets/firebase.js";
import { requireUser, touchUser, topHtml, setTop, homeBtnHtml, loaderHtml, msgHtml, emptyHtml, siteData, T } from "./assets/app.js";

const app = document.getElementById('app');
document.body.insertAdjacentHTML('afterbegin', topHtml({ title: 'রুকন প্রস্তুতি', noBack: true }));
app.innerHTML = `<div class="p-stack btns">${loaderHtml(3)}</div>`;
const user = await requireUser();
touchUser(user);
try { const { s: d } = await siteData(); if (d.siteName && d.siteName !== 'ইসলামিক অ্যাপ') { setTop(d.siteName); document.title = d.siteName; } } catch (e) {}
try {
  const snap = await getDocs(collection(db, 'home_buttons'));
  const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.v === 3 && !x.hidden).sort((a, b) => (a.order || 0) - (b.order || 0));
  app.innerHTML = items.length
    ? `<div class="p-stack btns">${items.map((b, i) => homeBtnHtml({ label: b.name, href: 'section.html?h=' + encodeURIComponent(b.id), i })).join('')}</div>`
    : emptyHtml('', T('home_empty_t'), T('home_empty_s'));
} catch (err) { console.error(err); app.innerHTML = msgHtml(T('load_err'), true); }
</script>
</body>
</html>
